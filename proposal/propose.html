<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Proposal for Sneha Shukla</title>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Roboto:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Roboto', sans-serif;
            text-align: center;
            background: linear-gradient(135deg, #ff9a9e, #fecfef, #fecfef);
            color: #333;
            padding: 20px;
            margin: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            position: relative;
        }
        h1 {
            font-family: 'Dancing Script', cursive;
            font-size: 2.5em;
            color: #d63384;
            margin-bottom: 20px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.1);
        }
        p {
            font-size: 1.1em;
            margin-bottom: 30px;
            max-width: 90%;
            line-height: 1.6;
        }
        .sticker-container {
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 30px;
        }
        .sticker {
            width: 150px; /* Perfect circle size */
            height: 150px;
            border-radius: 50%; /* Makes it a perfect circle */
            object-fit: cover; /* Ensures the image fits perfectly inside the circle */
            box-shadow: 0 4px 8px rgba(0,0,0,0.2);
            border: 3px solid #fff; /* Optional white border for better visibility */
        }
        .buttons {
            margin-top: 30px;
            position: relative;
            height: 140px;
            width: 100%;
            max-width: 450px;
            z-index: 10;
        }
        button {
            font-size: 18px;
            padding: 15px 30px;
            margin: 10px;
            border: none;
            border-radius: 30px;
            cursor: pointer;
            transition: all 0.4s ease;
            font-weight: bold;
            box-shadow: 0 6px 12px rgba(0,0,0,0.15);
            position: relative;
            overflow: hidden;
        }
        button::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.3), transparent);
            transition: left 0.5s;
        }
        button:hover::before {
            left: 100%;
        }
        #yesBtn {
            background: linear-gradient(45deg, #28a745, #20c997, #17a2b8);
            color: white;
        }
        #yesBtn:hover {
            transform: scale(1.15) rotate(2deg);
            box-shadow: 0 8px 16px rgba(0,0,0,0.25);
            animation: pulse 1s infinite;
        }
        #noBtn {
            background: linear-gradient(45deg, #dc3545, #fd7e14, #ffc107);
            color: white;
            position: absolute;
            transition: transform 0.5s ease;
        }
        #noBtn:hover {
            transform: scale(1.1) rotate(-2deg);
            box-shadow: 0 8px 16px rgba(0,0,0,0.25);
            animation: pulse 1s infinite;
        }
        @keyframes pulse {
            0% { box-shadow: 0 6px 12px rgba(0,0,0,0.15); }
            50% { box-shadow: 0 10px 20px rgba(0,0,0,0.3); }
            100% { box-shadow: 0 6px 12px rgba(0,0,0,0.15); }
        }
        #message {
            margin-top: 40px;
            font-size: 1.3em;
            color: #d63384;
            font-weight: bold;
            position: relative;
            z-index: 10;
            min-height: 50px;
            animation: fadeIn 0.5s ease-in;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        /* Mobile responsiveness */
        @media (max-width: 768px) {
            h1 {
                font-size: 2em;
            }
            p {
                font-size: 1em;
            }
            .sticker {
                width: 120px;
                height: 120px;
            }
            .buttons {
                height: 120px;
                max-width: 100%;
            }
            button {
                font-size: 16px;
                padding: 12px 25px;
            }
            #message {
                font-size: 1.1em;
            }
        }
    </style>
</head>
<body>
    <h1>Will You Be Mine, Sneha Shukla? ❤️</h1>
    <p>I've been thinking about you a lot, and I can't imagine my life without you. You're amazing, kind, and beautiful. Please say yes!</p>
    
    <!-- Centered circular sticker -->
    <div class="sticker-container">
        <img class="sticker" src="https://i.postimg.cc/Vv1z9mWB/div_4_part_1.jpg" alt="Sticker">
    </div>
    
    <div class="buttons">
        <button id="yesBtn">Yes! 😍</button>
        <button id="noBtn">No</button>
    </div>
    
    <div id="message"></div>

    <script>
        const yesBtn = document.getElementById('yesBtn');
        const noBtn = document.getElementById('noBtn');
        const message = document.getElementById('message');
        
        let noClicks = 0;
        const convincingMessages = [
            "Are you sure? Think again! 💕",
            "Come on, Sneha, give me a chance! 😘",
            "No? But we're perfect together! 🌟",
            "Please reconsider... I promise to make you happy! ❤️",
            "Okay, one more try: Say yes! 🎉",
            "You know you want to! Let's be unstoppable! 🔥",
            "Imagine all the fun we'll have... Say yes! 🥰",
            "Don't break my heart, Sneha! 💔 (Just kidding, but seriously!)",
            "One little word: Yes! It'll change everything for the better. ✨",
            "Alright, last chance... Or is it? 😉 You're too amazing to say no!",
            "Fine, but I'll keep asking until you do! 😜",
            "Think of the adventures! Say yes and let's start! 🌈",
            "Sneha, you're my everything—say yes and let's make it official! 💑",
            "No way you're saying no... You're too sweet! 🍬❤️",
            "Come on, give in to the romance! 📖💕",
            "I won't stop until you say yes—because you deserve the best! 🌹",
            "Let's create our own love story! Say yes! 📖✨",
            "You're the one I've been waiting for—please say yes! ⏳❤️",
            "No? But our chemistry is undeniable! ⚗️💥",
            "One click away from happiness! Click yes! 😊"
        ];
        
        yesBtn.addEventListener('click', () => {
            message.textContent = "Yay! I knew you'd say yes! Let's make some amazing memories together, Sneha! 💖";
            noBtn.style.display = 'none'; // Hide the no button on yes
        });
        
        noBtn.addEventListener('click', () => {
            noClicks++;
            if (noClicks <= convincingMessages.length) {
                message.textContent = convincingMessages[noClicks - 1];
            } else {
                message.textContent = "Still no? Okay, but I'm not giving up! 😉";
            }
            
            // Move the no button to a random position within the buttons div
            const container = document.querySelector('.buttons');
            const maxX = container.offsetWidth - noBtn.offsetWidth;
            const maxY = container.offsetHeight - noBtn.offsetHeight;
            const randomX = Math.random() * maxX;
            const randomY = Math.random() * maxY;
            noBtn.style.left = randomX + 'px';
            noBtn.style.top = randomY + 'px';
        });
    </script>
</body>
</html>
